# Mosquitto configuration for smart-home-pv challenge
# Allow anonymous connections for lab/training environment

# MQTT Protocol listener
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener for React admin dashboard
listener 9001 0.0.0.0
protocol websockets

# Allow anonymous connections (no authentication required)
allow_anonymous true

# Keep retained messages across restarts. The dashboard hydrates from retained
# pv/telemetry/+ and pv/history/+ messages; those live in the broker's memory, so
# with persistence off every restart blanks the Area Map until a feeder happens
# to be up and republishes. /mosquitto/data is a named volume in compose.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Log to stdout for container logs
log_dest stdout
log_type error
log_type warning
connection_messages false

# Connection settings
max_connections -1
