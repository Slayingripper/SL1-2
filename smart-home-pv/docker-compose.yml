services:
  pv-controller:
    build: .
    image: scl-challenge-smart-home-pv
    container_name: scl-challenge-smart-home-pv
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.65
    ports:
      - "8080:80"  # Expose PV controller admin dashboard on host 8080
      - "15002:15002" # Expose Modbus TCP for external tools using 15002
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
      - MODBUS_PORT=15002
      - BLOCK_TTL_SECONDS=60
      - LOG_LEVEL=WARNING
      - MQTT_TELEMETRY_INTERVAL=3
      - MQTT_STATUS_INTERVAL=30
      - DOCUMENTS_DIR=/opt/pv-controller/Documents
      - HOST_HOME_LOGS_DIR=/opt/pv-controller/home-logs
    volumes:
      - ./logs:/opt/pv-controller/logs
      - ${HOME}/Documents:/opt/pv-controller/Documents
      - ${HOME}/smart-home-pv-logs:/opt/pv-controller/home-logs
      # NOTE: the dashboard bundle is baked into the image by the `dashboard`
      # build stage in the Dockerfile. Do NOT mount ./admin-dashboard/dist here:
      # a host path that is empty or missing shadows the baked bundle and the
      # server falls back to the "Admin Dashboard Not Built" page. For hot
      # reload during front-end development, run the dashboard inside the
      # container instead:
      #   docker compose exec pv-controller python3 -m http.server 3000 -d /src/admin-dashboard/dist
      # or see docker-compose.dev.yml for the bind-mount override.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.connect(('127.0.0.1',80)); s.close()"]
      interval: 20s
      timeout: 5s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: scl-challenge-mosquitto
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.66
    ports:
      - "1883:1883"  # MQTT broker on host 1883 (all interfaces)
      - "9001:9001"  # WebSocket for React dashboard
    volumes:
      # Not :ro - the image entrypoint chowns this file at startup and fails
      # noisily on a read-only bind mount.
      - ./mosquitto-config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Retained messages (the data the dashboard hydrates from) live in the
      # broker's store file - keep it across broker/container recreations.
      - mosquitto-data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "sh", "-c", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 1 || exit 1"]
      # The seeder and the site feeders gate on this condition, so keep the
      # probe frequent - a 30s interval made `up -d` idle for half a minute.
      interval: 5s
      timeout: 5s
      retries: 5

  noise:
    build:
      context: ./tools/noise
    image: scl-challenge-smart-home-pv-noise
    container_name: scl-challenge-smart-home-pv-noise
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.71
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
    volumes:
      - ./logs:/opt/pv-controller/logs
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      mosquitto:
        condition: service_healthy
      pv-controller:
        condition: service_started
  victim:
    build:
      context: ./tools/victim
    image: scl-challenge-smart-home-pv-victim
    container_name: scl-challenge-smart-home-pv-victim
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.72
    environment:
      PV_URL: http://pv-controller
      PV_HOST: pv-controller
      PV_BASE_URL: http://pv-controller
      VICTIM_ADMIN_USERNAME: admin
      VICTIM_ADMIN_PASSWORD: admin123
    volumes:
      - ./logs:/opt/pv-controller/logs
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      - pv-controller
    tty: true
    command: ["node", "victim_cyber_range.js"]
  telemetry-seeder:
    build:
      context: ./tools/noise
    image: scl-challenge-smart-home-pv-seeder
    container_name: scl-challenge-smart-home-pv-seeder
    # Long-running: seeds the retained per-site data the dashboard hydrates
    # from, then refreshes it on an interval and immediately after any broker
    # reconnect, so the Area Map / per-asset views are never left without
    # history.
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.73
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
      # Refresh cadence for the retained site data, in minutes.
      - SEED_INTERVAL=300
    volumes:
      - ./logs:/opt/pv-controller/logs
      # Bind-mounted so seeder changes take effect on `up -d` without a rebuild.
      - ./tools/noise/noise_generator.py:/app/noise_generator.py:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      # Wait for the broker to be genuinely accepting connections, not just
      # started - a race here loses the seed entirely.
      mosquitto:
        condition: service_healthy
    # --seed-loop seeds now, refreshes on the interval, and re-seeds the moment
    # the broker reconnects. This replaces the previous
    # `while true; do python seed_once.py; sleep ...` wrapper, which needed a
    # seed_once.py that was never committed and could not react to a broker
    # restart (the shell loop just slept through the outage).
    command: ["python","noise_generator.py","--seed-loop"]

  # --- Area map site feeders: one container feeds one site with power ----
  feeder-house-1:
    build:
      context: ./tools/noise
    image: scl-challenge-smart-home-pv-site-feeder
    container_name: scl-feeder-house-1
    hostname: scl-feeder-house-1
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.81
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
    command: ["python", "noise_generator.py", "--site", "house-1"]
    depends_on:
      mosquitto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  feeder-house-2:
    build:
      context: ./tools/noise
    image: scl-challenge-smart-home-pv-site-feeder
    container_name: scl-feeder-house-2
    hostname: scl-feeder-house-2
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.82
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
    command: ["python", "noise_generator.py", "--site", "house-2"]
    depends_on:
      mosquitto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  feeder-house-3:
    build:
      context: ./tools/noise
    image: scl-challenge-smart-home-pv-site-feeder
    container_name: scl-feeder-house-3
    hostname: scl-feeder-house-3
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.83
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
    command: ["python", "noise_generator.py", "--site", "house-3"]
    depends_on:
      mosquitto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  feeder-pv-plant:
    build:
      context: ./tools/noise
    image: scl-challenge-smart-home-pv-site-feeder
    container_name: scl-feeder-pv-plant
    hostname: scl-feeder-pv-plant
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.84
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
    command: ["python", "noise_generator.py", "--site", "pv-plant"]
    depends_on:
      mosquitto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  feeder-army-base:
    build:
      context: ./tools/noise
    image: scl-challenge-smart-home-pv-site-feeder
    container_name: scl-feeder-army-base
    hostname: scl-feeder-army-base
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.85
    environment:
      - MQTT_HOST=mosquitto
      - TZ=Asia/Nicosia
    command: ["python", "noise_generator.py", "--site", "army-base"]
    depends_on:
      mosquitto:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  replayer:
    build:
      context: ./tools/replayer
    image: scl-challenge-smart-home-pv-replayer
    container_name: scl-challenge-smart-home-pv-replayer
    restart: unless-stopped
    networks:
      playground-net:
        ipv4_address: 172.20.0.74
    environment:
      - PV_SERVER=http://pv-controller
      - PCAP_PATH=/opt/pv-controller/logs/modbus.pcap
      - REPLAYER_POLL_INTERVAL=3
    depends_on:
      - pv-controller
    volumes:
      - ./logs:/opt/pv-controller/logs
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  playground-net:
    external: true

volumes:
  # MQTT retained-message store (see mosquitto-config/mosquitto.conf)
  mosquitto-data:
